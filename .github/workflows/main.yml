name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and Prepare Project
        run: |
          # فك ضغط أي ملف zip موجود تلقائياً لتفادي مشاكل الحروف العربية
          unzip *.zip -d extracted_project
          
          # التحقق من مكان الملفات ونقلها للجذر الرئيسي
          if [ -f extracted_project/build.gradle ] || [ -f extracted_project/build.gradle.kts ]; then
            mv extracted_project/* .
          else
            # لو الملفات جوه مجلد فرعي
            mv extracted_project/*/* .
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamoApp-APK
          path: app/build/outputs/apk/debug/*.apk
